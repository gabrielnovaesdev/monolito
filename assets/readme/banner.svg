<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="MONÓLITO, arquitetura feita para permanecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2a3d"/>
      <stop offset="0.55" stop-color="#9a6a55"/>
      <stop offset="0.78" stop-color="#e8a06a"/>
      <stop offset="1" stop-color="#c8925f"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98361"/>
      <stop offset="1" stop-color="#5d3d2c"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3df"/>
      <stop offset="0.25" stop-color="#ffd2a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#f0a35e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14120f"/>
      <stop offset="0.85" stop-color="#1d1a17"/>
      <stop offset="1" stop-color="#3a2c22"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-10%" width="200%" height="120%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <style>
      .seam { animation: pulse 3.2s ease-in-out infinite; }
      .halo { animation: breathe 6s ease-in-out infinite; transform-origin: 846px 214px; }
      .dust { animation: drift 14s linear infinite; }
      @keyframes pulse { 0%, 100% { opacity: .55 } 50% { opacity: 1 } }
      @keyframes breathe { 0%, 100% { transform: scale(1); opacity: .85 } 50% { transform: scale(1.08); opacity: 1 } }
      @keyframes drift { from { transform: translateX(0) } to { transform: translateX(-120px) } }
      @media (prefers-reduced-motion: reduce) { .seam, .halo, .dust { animation: none } }
    </style>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <circle class="halo" cx="846" cy="214" r="150" fill="url(#sun)"/>
  <path d="M0 238 C 180 222 320 230 470 236 S 820 222 1200 232 L1200 360 L0 360 Z" fill="#a8775a" opacity=".55"/>
  <path d="M0 252 C 220 240 380 250 600 246 S 980 236 1200 248 L1200 360 L0 360 Z" fill="url(#sand)"/>
  <!-- sombra longa do monólito em direção a quem olha -->
  <path d="M790 286 L846 286 L700 360 L560 360 Z" fill="#2a1c14" opacity=".55"/>

  <!-- monólito -->
  <rect x="770" y="282" width="110" height="10" rx="1.5" fill="#100e0c"/>
  <rect x="788" y="92" width="76" height="192" rx="2" fill="url(#stone)"/>
  <rect class="seam" x="825.4" y="96" width="1.6" height="184" fill="#ffc68c" filter="url(#glow)"/>
  <rect class="seam" x="825.6" y="96" width="0.9" height="184" fill="#ffe3c2"/>

  <g class="dust" fill="#ffe3c2" opacity=".55">
    <circle cx="640" cy="170" r="1.1"/><circle cx="910" cy="140" r="1.3"/><circle cx="1010" cy="200" r=".9"/>
    <circle cx="720" cy="230" r="1"/><circle cx="1110" cy="160" r="1.2"/><circle cx="960" cy="250" r=".8"/>
    <circle cx="1240" cy="190" r="1.1"/><circle cx="1290" cy="140" r=".9"/>
  </g>

  <g font-family="Inter Tight, Inter, Helvetica Neue, Arial, sans-serif" fill="#f5f1ea">
    <text x="64" y="74" font-size="14" font-weight="500" letter-spacing="6">MONÓLITO</text>
    <text x="64" y="176" font-size="54" font-weight="300" letter-spacing="-2">Arquitetura feita</text>
    <text x="64" y="236" font-size="54" font-weight="300" letter-spacing="-2">para <tspan fill="#ffe0bd" font-weight="200">permanecer.</tspan></text>
    <text x="64" y="300" font-size="12" font-weight="500" letter-spacing="3" fill="#f5f1ea" opacity=".7">JORNADA 3D EM WEBGL · THREE.JS · GSAP · BLENDER</text>
  </g>
</svg>
